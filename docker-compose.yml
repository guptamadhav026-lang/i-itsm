# Runs the app with a real PostgreSQL database:  docker compose up --build
# Then open http://localhost:8080 (demo data is loaded on the first start).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      ITSM_DB_URL: jdbc:postgresql://db:5432/itsm
      ITSM_DB_USER: itsm
      ITSM_DB_PASSWORD: itsm
      # Empty means a random signing key at every start; set your own (32+ characters) to keep logins across restarts
      ITSM_JWT_SECRET: ${ITSM_JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
