# Each test context gets its own in-memory database
spring.datasource.url=jdbc:h2:mem:itsm-${random.uuid};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Tests run the SLA monitor by hand with a controllable clock
itsm.sla.monitor-enabled=false
logging.level.com.itsm.notification=WARN
