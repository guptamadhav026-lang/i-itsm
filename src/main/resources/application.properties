# ============================================================
# I-ITSM configuration
# ============================================================
spring.application.name=i-itsm
server.port=8080

# ---------- Database ----------
# Default: H2, a small Java database saved in the ./data folder. Nothing to install.
# To use PostgreSQL instead, run with the "postgres" profile (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates/updates the tables from the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Security ----------
# Secret used to sign login tokens. Override it in production with the ITSM_JWT_SECRET environment variable.
itsm.security.jwt-secret=${ITSM_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
itsm.security.token-validity-hours=8
# Frontends allowed to call the API from a browser (React dev servers usually run on 5173 or 3000).
itsm.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Business rules ----------
# WEIGHTED or ITIL_MATRIX (can be switched at runtime by an admin)
itsm.priority.default-strategy=WEIGHTED
# SMART, SKILL_BASED, LOAD_BASED or ROUND_ROBIN
itsm.assignment.default-strategy=SMART
# How often the SLA monitor checks open incidents (milliseconds)
itsm.sla.monitor-enabled=true
itsm.sla.monitor-interval-ms=60000
# Only incidents reported in the last N hours are compared for duplicates / correlation
itsm.duplicates.window-hours=72
itsm.correlation.window-hours=24
# Load demo users, services and incidents into an empty database
itsm.seed.enabled=true

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
