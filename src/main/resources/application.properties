# ============================================================
# I-ITSM configuration
# ============================================================
spring.application.name=i-itsm
server.port=8080

# ---------- Database ----------
# Default: H2, a small Java database saved in the ./data folder. Nothing to install.
# To use PostgreSQL instead, run with the "postgres" profile (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/itsm
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates/updates the tables from the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- Security ----------
# Secret used to sign login tokens (at least 32 characters), from the ITSM_JWT_SECRET environment variable.
# If it is not set, a random key is made at every start and everyone has to log in again after a restart.
itsm.security.jwt-secret=${ITSM_JWT_SECRET:}
itsm.security.token-validity-hours=8
# Frontends allowed to call the API from a browser (React dev servers usually run on 5173 or 3000).
itsm.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Business rules ----------
# WEIGHTED or ITIL_MATRIX (can be switched at runtime by an admin)
itsm.priority.default-strategy=WEIGHTED
# SMART, SKILL_BASED, LOAD_BASED or ROUND_ROBIN
itsm.assignment.default-strategy=SMART
# How often the SLA monitor checks open incidents (milliseconds)
itsm.sla.monitor-enabled=true
itsm.sla.monitor-interval-ms=60000
# Only incidents reported in the last N hours are compared for duplicates / correlation
itsm.duplicates.window-hours=72
itsm.correlation.window-hours=24
# E-mails are only written to the log. Set this to false to pretend the mail server is down
# (shows that a NetworkFailureException is caught and in-app notifications still go out).
itsm.notifications.email.server-up=true
# Load demo users, services and incidents into an empty database
itsm.seed.enabled=true
# Time zone for times written into audit and notification texts (servers and Docker often run in UTC)
itsm.time-zone=${ITSM_TIME_ZONE:Asia/Kolkata}

# ---------- Google Gemini (optional) ----------
# With an API key (free from https://aistudio.google.com) new incidents are categorised by Gemini,
# with the keyword match as the fallback. Without a key only the keywords are used.
itsm.ai.gemini.api-key=${GEMINI_API_KEY:}
itsm.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
itsm.ai.gemini.base-url=https://generativelanguage.googleapis.com

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
